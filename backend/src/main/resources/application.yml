spring:
  application:
    name: phishing-awareness
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Datasource
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://host.docker.internal:3306/phishing_awareness?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:phishing_app}
    password: ${SPRING_DATASOURCE_PASSWORD:CHANGE_ME}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Jackson (Jackson 3.x - configure via properties or Java config)
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never
    include-binding-errors: never

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# GoPhish integration
gophish:
  api-url: ${GOPHISH_API_URL:https://gophish:3333}
  api-key: ${GOPHISH_API_KEY:}
  url: ${GOPHISH_URL:https://gophish.localtest.me}

# JWT
jwt:
  secret: ${JWT_SECRET:default-dev-secret-change-in-production}
  expiration-ms: 86400000

# SMTP
smtp:
  host: ${SMTP_HOST:mailpit}
  port: ${SMTP_PORT:1025}

logging:
  level:
    com.company.phishingawareness: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
