spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  sql:
    init:
      mode: never

jwt:
  secret: test-secret-key-that-is-long-enough-for-hmac-sha256-algorithm-ok
  expiration-ms: 86400000

logging:
  level:
    org.springframework: WARN
    com.company.phishingawareness: DEBUG
